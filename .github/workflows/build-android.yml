name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential             python3-pip python3-venv libffi-dev libssl-dev             autoconf automake libtool pkg-config zlib1g-dev             libncurses5-dev libncursesw5-dev cmake
      - name: Install Python build tools
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user "Cython==0.29.36" "buildozer==1.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Poetry-ReelMaker-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
